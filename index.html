<!doctype html>
<html lang="es" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Investment Ops — Sala de Control</title>
<style>
  :root{
    --font: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  html[data-theme="dark"]{
    color-scheme: dark;
    --page:#0d0d0d; --surface:#1a1a19; --surface-2:#212120;
    --ink:#ffffff; --ink-2:#c3c2b7; --muted:#898781;
    --grid:#2c2c2a; --baseline:#383835; --hairline:rgba(255,255,255,.10);
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
    --good:#0ca30c; --warning:#fab219; --serious:#ec835a; --critical:#d03b3b;
    --delta-up:#0ca30c;
    --accent:#3987e5;
    --glow: 0 0 24px rgba(57,135,229,.18);
  }
  html[data-theme="light"]{
    color-scheme: light;
    --page:#f9f9f7; --surface:#fcfcfb; --surface-2:#f0efec;
    --ink:#0b0b0b; --ink-2:#52514e; --muted:#898781;
    --grid:#e1e0d9; --baseline:#c3c2b7; --hairline:rgba(11,11,11,.10);
    --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#4a3aa7; --s8:#e34948;
    --good:#0ca30c; --warning:#fab219; --serious:#ec835a; --critical:#d03b3b;
    --delta-up:#006300;
    --accent:#2a78d6;
    --glow: none;
  }
  *{box-sizing:border-box}
  body{
    margin:0; font-family:var(--font); background:var(--page); color:var(--ink);
    background-image: radial-gradient(ellipse 80% 50% at 50% -10%, rgba(57,135,229,.07), transparent),
      linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size:auto, 48px 48px, 48px 48px;
    background-attachment:fixed;
    min-height:100vh;
  }
  html[data-theme="light"] body{background-image:none}

  .wrap{max-width:1200px; margin:0 auto; padding:0 20px 80px}

  /* ── Topbar ── */
  .topbar{display:flex; align-items:center; gap:14px; padding:18px 0; flex-wrap:wrap}
  .logo{display:flex; align-items:center; gap:10px; font-weight:700; letter-spacing:.14em; font-size:15px}
  .logo .mark{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--s1),var(--s7));
    display:grid;place-items:center;color:#fff;font-size:15px;box-shadow:var(--glow)}
  .logo small{display:block;font-weight:400;letter-spacing:.28em;font-size:9px;color:var(--muted)}
  .spacer{flex:1}
  .statuspill{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-2);
    border:1px solid var(--hairline);border-radius:999px;padding:6px 14px;background:var(--surface)}
  .pulse{width:8px;height:8px;border-radius:50%;background:var(--good);position:relative}
  .pulse.err{background:var(--critical)} .pulse.idle{background:var(--muted)}
  .pulse::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:1px solid currentColor;
    color:inherit;opacity:.5;animation:ping 2s ease-out infinite}
  .pulse{color:var(--good)} .pulse.err{color:var(--critical)} .pulse.idle{animation:none;color:var(--muted)}
  @keyframes ping{0%{transform:scale(.6);opacity:.6}100%{transform:scale(1.6);opacity:0}}
  .iconbtn{border:1px solid var(--hairline);background:var(--surface);color:var(--ink-2);border-radius:10px;
    padding:8px 12px;cursor:pointer;font-size:13px;font-family:var(--font)}
  .iconbtn:hover{color:var(--ink);border-color:var(--muted)}

  /* ── Tabs ── */
  .tabs{display:flex;gap:4px;border:1px solid var(--hairline);background:var(--surface);border-radius:12px;
    padding:4px;overflow-x:auto;position:sticky;top:10px;z-index:40;box-shadow:0 8px 30px rgba(0,0,0,.25)}
  html[data-theme="light"] .tabs{box-shadow:0 4px 16px rgba(0,0,0,.06)}
  .tab{flex:1;min-width:max-content;border:none;background:transparent;color:var(--muted);font-family:var(--font);
    font-size:12px;letter-spacing:.12em;text-transform:uppercase;padding:9px 16px;border-radius:9px;cursor:pointer;
    transition:all .15s}
  .tab:hover{color:var(--ink-2)}
  .tab.on{background:var(--surface-2);color:var(--ink);box-shadow:inset 0 0 0 1px var(--hairline)}
  .tab .n{display:inline-block;margin-left:6px;font-size:10px;color:var(--accent);font-weight:700}

  section.view{display:none;margin-top:26px;animation:fadein .25s ease}
  section.view.on{display:block}
  @keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  .card{background:var(--surface);border:1px solid var(--hairline);border-radius:14px;padding:20px}
  .card + .card{margin-top:16px}
  .kicker{font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
  h2.title{margin:0 0 4px;font-size:20px;font-weight:700}
  .meta{font-size:12px;color:var(--muted)}

  /* stat tiles */
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
  .tile{background:var(--surface);border:1px solid var(--hairline);border-radius:14px;padding:16px 18px;position:relative;overflow:hidden}
  .tile::before{content:"";position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--accent),transparent)}
  .tile .lbl{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
  .tile .val{font-size:26px;font-weight:700;margin-top:6px}
  .tile .sub{font-size:12px;color:var(--ink-2);margin-top:2px}

  /* agent cards */
  .agentgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
  .agent{background:var(--surface);border:1px solid var(--hairline);border-radius:14px;padding:18px;cursor:pointer;
    transition:transform .15s, border-color .15s;position:relative;overflow:hidden}
  .agent:hover{transform:translateY(-2px);border-color:var(--muted)}
  .agent::before{content:"";position:absolute;top:0;left:0;bottom:0;width:3px;background:var(--ac)}
  .agent .head{display:flex;align-items:center;gap:10px}
  .agent .chip{width:34px;height:34px;border-radius:9px;background:color-mix(in srgb, var(--ac) 18%, transparent);
    color:var(--ac);display:grid;place-items:center;font-size:16px}
  .agent .nm{font-weight:700;font-size:15px}
  .agent .rl{font-size:11px;color:var(--muted)}
  .agent .scorebadge{margin-left:auto;font-size:12px;font-weight:700;border:1px solid var(--hairline);
    border-radius:999px;padding:3px 10px;color:var(--ink-2)}
  .agent .last{margin-top:12px;font-size:13px;color:var(--ink-2);line-height:1.45;display:-webkit-box;
    -webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .agent .foot{margin-top:10px;font-size:11px;color:var(--muted)}
  .agent .state{display:flex;align-items:center;gap:6px;margin-top:10px;font-size:11px;
    letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  .agent .state b{font-weight:700;letter-spacing:.14em}
  .sdot{width:7px;height:7px;border-radius:50%;background:var(--muted);flex:none}
  .sdot.active{background:var(--good);box-shadow:0 0 0 3px color-mix(in srgb, var(--good) 22%, transparent);
    animation:breathe 1.6s ease-in-out infinite}
  .sdot.idle{background:var(--muted)}
  .sdot.error{background:var(--critical);box-shadow:0 0 0 3px color-mix(in srgb, var(--critical) 22%, transparent)}
  .sdot.offline{background:var(--baseline)}
  @keyframes breathe{0%,100%{opacity:1}50%{opacity:.45}}
  .agent .tcount{margin-left:auto;color:var(--ink-2)}

  /* command strip */
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:0 0 14px}
  .kpi{background:var(--surface);border:1px solid var(--hairline);border-radius:12px;padding:11px 14px}
  .kpi .lbl{font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
  .kpi .val{font-size:19px;font-weight:700;margin-top:3px;font-variant-numeric:tabular-nums}
  .kpi .val.warn{color:var(--warning)} .kpi .val.ok{color:var(--good)} .kpi .val.bad{color:var(--critical)}

  /* alert banner */
  .alerts{margin:0 0 14px;display:flex;flex-direction:column;gap:8px}
  .alertbar{display:flex;align-items:flex-start;gap:11px;border-radius:12px;padding:12px 15px;font-size:13px;
    border:1px solid var(--ac);background:color-mix(in srgb, var(--ac) 11%, var(--surface))}
  .alertbar .ico{color:var(--ac);font-size:14px;line-height:1.3}
  .alertbar .msg{flex:1;color:var(--ink)}
  .alertbar .hint{display:block;color:var(--ink-2);font-size:12px;margin-top:3px}
  .alertbar .lv{font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--ac);
    border:1px solid var(--ac);border-radius:999px;padding:2px 9px;white-space:nowrap}

  /* approvals */
  .appr{background:var(--surface);border:1px solid var(--hairline);border-left:3px solid var(--ac);
    border-radius:12px;padding:16px 18px;margin-bottom:11px}
  .appr .row1{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .appr .ttl{font-weight:600;font-size:14.5px;flex:1;min-width:200px}
  .prio{font-size:9px;letter-spacing:.16em;text-transform:uppercase;border-radius:5px;padding:3px 8px;font-weight:700}
  .prio.alta{background:color-mix(in srgb, var(--critical) 16%, transparent);color:var(--critical)}
  .prio.media{background:color-mix(in srgb, var(--warning) 16%, transparent);color:var(--warning)}
  .prio.baja{background:var(--surface-2);color:var(--muted)}
  .appr .det{margin-top:9px}
  .appr .acts{display:flex;gap:8px;margin-top:13px;flex-wrap:wrap;align-items:center}
  .abtn{border:1px solid var(--hairline);background:var(--surface-2);color:var(--ink);border-radius:9px;
    padding:7px 16px;font-size:12.5px;cursor:pointer;font-family:var(--font);font-weight:600}
  .abtn.ok{border-color:var(--good);color:var(--good)}
  .abtn.ok:hover{background:color-mix(in srgb, var(--good) 16%, transparent)}
  .abtn.no{border-color:var(--critical);color:var(--critical)}
  .abtn.no:hover{background:color-mix(in srgb, var(--critical) 16%, transparent)}
  .abtn:disabled{opacity:.4;cursor:not-allowed}
  .readonly{font-size:12px;color:var(--muted);line-height:1.5}

  /* opportunities */
  .filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .fbtn{border:1px solid var(--hairline);background:var(--surface);color:var(--ink-2);border-radius:999px;
    padding:6px 14px;font-size:12px;cursor:pointer;font-family:var(--font)}
  .fbtn.on{background:var(--surface-2);color:var(--ink);border-color:var(--muted)}
  .opp{background:var(--surface);border:1px solid var(--hairline);border-radius:14px;padding:18px;margin-bottom:12px}
  .opp .row1{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .opp .sym{font-weight:700;font-size:15px}
  .opp .tag{font-size:10px;letter-spacing:.12em;text-transform:uppercase;border-radius:6px;padding:3px 8px;
    background:color-mix(in srgb, var(--ac) 16%, transparent);color:var(--ac)}
  .badge{font-size:11px;font-weight:600;border-radius:999px;padding:3px 10px;display:inline-flex;align-items:center;gap:5px}
  .badge.abierta{background:color-mix(in srgb, var(--s1) 15%, transparent);color:var(--s1)}
  .badge.acierto{background:color-mix(in srgb, var(--good) 15%, transparent);color:var(--good)}
  .badge.error{background:color-mix(in srgb, var(--critical) 15%, transparent);color:var(--critical)}
  .badge.caducada{background:var(--surface-2);color:var(--muted)}
  .conv{margin-left:auto;display:flex;gap:3px;align-items:center}
  .conv i{width:8px;height:8px;border-radius:2px;background:var(--surface-2);display:block}
  .conv i.f{background:var(--ac)}
  .opp .thesis{margin-top:10px;font-size:13.5px;color:var(--ink-2);line-height:1.5}
  .opp .risks{margin-top:8px;font-size:12.5px;color:var(--muted);line-height:1.45}
  .opp .predl{margin-top:12px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;
    background:var(--surface-2);border:1px solid var(--hairline);border-radius:10px;padding:9px 13px}
  .opp .predl i{font-style:normal;font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:2px}
  .opp .predl b{font-weight:700;font-variant-numeric:tabular-nums;font-size:14px;display:block}
  .opp .predl .pl-e b{color:var(--ink-2)}
  .opp .predl .pl-o b{color:var(--s1)}
  .opp .predl .pl-o b.na{color:var(--muted);font-weight:500}
  .opp .predl .pl-arrow{color:var(--muted);font-size:17px;line-height:1}
  .opp .predl .pl-now{margin-left:auto}
  .opp .predl .pl-now b{color:var(--ink)}
  .opp .prog{margin-top:8px}
  .opp .prog-bar{height:7px;background:var(--surface-2);border-radius:5px;overflow:hidden}
  .opp .prog-bar span{display:block;height:100%;border-radius:5px;background:var(--s1)}
  .opp .prog.done .prog-bar span{background:var(--good)}
  .opp .prog.bad .prog-bar span{background:var(--critical)}
  .opp .prog-meta{margin-top:5px;font-size:11.5px;color:var(--muted)}
  .opp .prog-meta b{color:var(--ink-2);font-variant-numeric:tabular-nums}
  .opp .foot{margin-top:10px;font-size:11px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap}
  .calib{margin-top:6px;font-size:11px;color:var(--muted);display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
  .calib .clbl{font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-right:2px}
  .calib .sep{color:var(--hairline);font-style:normal}
  .calib b{font-weight:700}
  .calib .cverd{margin-left:6px;font-weight:600}
  .calib .cverd.good{color:var(--good)}
  .calib .cverd.bad{color:var(--critical)}
  .trtab{width:100%;border-collapse:collapse;font-size:12.5px}
  .trtab th{text-align:left;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--hairline)}
  .trtab td{padding:8px;border-bottom:1px solid var(--hairline);font-variant-numeric:tabular-nums;color:var(--ink-2)}
  .trtab tbody tr:last-child td,.trtab tr:last-child td{border-bottom:none}
  .trtab th:not(:first-child),.trtab td:not(:first-child){text-align:center}

  /* tables */
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);text-align:left;
    padding:8px 10px;border-bottom:1px solid var(--hairline)}
  td{padding:9px 10px;border-bottom:1px solid var(--hairline);color:var(--ink-2)}
  td.num, th.num{text-align:right;font-variant-numeric:tabular-nums}
  td:first-child{color:var(--ink);font-weight:600}
  tr:hover td{background:color-mix(in srgb, var(--surface-2) 60%, transparent)}

  /* charts */
  .chartbox{margin-top:6px}
  .legend{display:flex;gap:14px;flex-wrap:wrap;margin:10px 0 4px;font-size:12px;color:var(--ink-2)}
  .legend i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:-1px}
  svg text{font-family:var(--font)}
  .tooltip{position:fixed;pointer-events:none;background:var(--surface-2);border:1px solid var(--hairline);
    border-radius:10px;padding:8px 12px;font-size:12px;color:var(--ink);z-index:100;display:none;
    box-shadow:0 8px 24px rgba(0,0,0,.35);max-width:260px}
  .tooltip .t1{font-weight:700}.tooltip .t2{color:var(--ink-2);margin-top:2px}

  /* markdown */
  .md{font-size:14px;line-height:1.65;color:var(--ink-2)}
  .md h1,.md h2,.md h3{color:var(--ink);margin:18px 0 8px;line-height:1.3}
  .md h1{font-size:19px}.md h2{font-size:16px}.md h3{font-size:14px}
  .md p{margin:8px 0}
  .md ul,.md ol{margin:8px 0;padding-left:22px}
  .md li{margin:4px 0}
  .md strong{color:var(--ink)}
  .md code{background:var(--surface-2);border-radius:5px;padding:1px 6px;font-size:12.5px}
  .md a{color:var(--accent)}
  .md blockquote{border-left:3px solid var(--accent);margin:10px 0;padding:2px 14px;color:var(--muted)}
  .md hr{border:none;border-top:1px solid var(--hairline);margin:14px 0}

  .hl{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
  .hl span{font-size:12px;border:1px solid var(--hairline);border-radius:999px;padding:5px 12px;color:var(--ink-2);
    background:var(--surface-2)}
  .hl span::before{content:"◆ ";color:var(--accent);font-size:10px}

  /* modal */
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);z-index:80;display:none;
    align-items:flex-start;justify-content:center;padding:5vh 16px;overflow:auto}
  .modal.on{display:flex}
  .modal .box{background:var(--surface);border:1px solid var(--hairline);border-radius:16px;max-width:760px;
    width:100%;padding:26px;position:relative}
  .modal .x{position:absolute;top:14px;right:14px}

  .empty{text-align:center;color:var(--muted);padding:44px 20px;font-size:13.5px;line-height:1.6}
  .empty .big{font-size:30px;margin-bottom:8px;opacity:.6}
  .select{border:1px solid var(--hairline);background:var(--surface);color:var(--ink);font-family:var(--font);
    border-radius:10px;padding:7px 12px;font-size:13px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media(max-width:800px){.grid2{grid-template-columns:1fr}}
  .runrow{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--hairline);font-size:13px}
  .runrow .dot{width:9px;height:9px;border-radius:50%}
  .footer{margin-top:40px;text-align:center;font-size:11px;color:var(--muted);letter-spacing:.08em}
  #loading{text-align:center;padding:80px 0;color:var(--muted);letter-spacing:.2em;font-size:12px;text-transform:uppercase}
  .scanner{width:220px;height:2px;background:var(--surface-2);margin:18px auto 0;border-radius:2px;overflow:hidden}
  .scanner i{display:block;width:60px;height:100%;background:var(--accent);animation:scan 1.2s ease-in-out infinite alternate}
  @keyframes scan{from{transform:translateX(0)}to{transform:translateX(160px)}}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="logo">
      <div class="mark">▲</div>
      <div>INVESTMENT&nbsp;OPS<small>EQUIPO DE AGENTES · v1</small></div>
    </div>
    <div class="spacer"></div>
    <div class="statuspill"><span class="pulse idle" id="statusdot"></span><span id="statustext">Conectando…</span></div>
    <button class="iconbtn" id="refresh" title="Actualizar">⟳</button>
    <button class="iconbtn" id="themebtn" title="Tema">◐</button>
  </div>

  <div class="kpis" id="kpis" style="display:none"></div>
  <div class="alerts" id="alerts"></div>

  <nav class="tabs" id="tabs">
    <button class="tab on" data-v="briefing">Briefing</button>
    <button class="tab" data-v="agentes">Agentes</button>
    <button class="tab" data-v="aprobaciones">Aprobaciones<span class="n" id="n-appr"></span></button>
    <button class="tab" data-v="oportunidades">Oportunidades<span class="n" id="n-opps"></span></button>
    <button class="tab" data-v="cartera">Cartera</button>
    <button class="tab" data-v="simulador">Simulador</button>
    <button class="tab" data-v="marcador">Marcador</button>
    <button class="tab" data-v="registro">Registro</button>
  </nav>

  <div id="loading">Sincronizando con el equipo<div class="scanner"><i></i></div></div>

  <section class="view" id="v-briefing"></section>
  <section class="view" id="v-agentes"></section>
  <section class="view" id="v-aprobaciones"></section>
  <section class="view" id="v-oportunidades"></section>
  <section class="view" id="v-cartera"></section>
  <section class="view" id="v-simulador"></section>
  <section class="view" id="v-marcador"></section>
  <section class="view" id="v-registro"></section>

  <div class="footer">INVESTMENT OPS · información generada por agentes de IA · no constituye asesoramiento financiero</div>
</div>

<div class="modal" id="modal"><div class="box">
  <button class="iconbtn x" onclick="closeModal()">✕</button>
  <div id="modalbody"></div>
</div></div>
<div class="tooltip" id="tooltip"></div>

<script>
/* ═══════════ CONFIG ═══════════ */
const API = "https://yukrbehehvjzacazckpl.supabase.co/functions/v1/it-panel";
const KEY = (function(){ try{ const p = new URLSearchParams(location.search).get("k"); if(p){ localStorage.setItem("itops_k", p); return p; } return localStorage.getItem("itops_k") || ""; }catch(e){ return new URLSearchParams(location.search).get("k") || ""; } })();
const PANEL_URL = API + "?k=" + KEY;

const esc = s => String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const fmtN = (n,d=2) => n==null?"—":Number(n).toLocaleString("es-ES",{minimumFractionDigits:0,maximumFractionDigits:d});
const fmtEUR = n => n==null?"—":Number(n).toLocaleString("es-ES",{style:"currency",currency:"EUR",maximumFractionDigits:0});
const fmtDate = s => s?new Date(s).toLocaleString("es-ES",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"}):"—";

// Convierte un número en formato español ("4.800", "137,98") a Number.
const numEs = s => { if(s==null) return null; const n=Number(String(s).replace(/\./g,"").replace(",",".")); return Number.isFinite(n)?n:null; };
// Extrae el objetivo de la tesis. Formato fijo nuevo: "Objetivo: 326 USD (+24%)"
// (con dos puntos → fuente fiable). Para las heredadas en prosa es conservador:
// exige moneda en el precio (años y márgenes no la llevan) y descarta usos de la
// palabra que no son precio-objetivo ("objetivo-vencimiento", "objetivo de margen").
function parseObjetivo(thesis){
  if(!thesis) return null;
  const t=String(thesis);
  let seg, strict=false;
  const std=t.match(/objetivo\s*:\s*([^.\n;]{1,40})/i);
  if(std){ seg=std[1]; strict=true; }
  else {
    const low=t.toLowerCase(), i=low.indexOf("objetivo");
    if(i<0) return null;
    if(/^[-\s]*(vencimiento|de\s+(margen|rentab|deuda|inflaci|precios))/.test(low.slice(i+8, i+8+16))) return null;
    seg=t.slice(i+8, i+8+45);
  }
  const cur=/€|\bEUR\b/i.test(seg)?"EUR":(/\$|\bUSD\b/i.test(seg)?"USD":"");
  const noPct=seg.replace(/([+-]?\s*\d+(?:[.,]\d+)?)\s*%/g," ");
  const priceM=noPct.match(/(\d{1,3}(?:\.\d{3})+(?:,\d+)?|\d+(?:[.,]\d+)?)/);
  let price=priceM?priceM[1]:null;
  if(price && !cur && !strict) price=null;          // en prosa, sin moneda no es precio
  const pctM=seg.match(/([+-]\s*\d+(?:[.,]\d+)?)\s*%/) || (strict?seg.match(/(\d+(?:[.,]\d+)?)\s*%/):null);
  const pct=pctM?pctM[1].replace(/\s+/g,"")+"%":"";  // en prosa, sólo % con signo (+/-)
  if(!price && !pct) return null;
  return {price, cur, pct};
}

/* minimal safe markdown */
function md(src){
  if(!src) return "";
  let t = esc(src).replace(/\r/g,"");
  t = t.replace(/^### (.*)$/gm,"<h3>$1</h3>").replace(/^## (.*)$/gm,"<h2>$1</h2>").replace(/^# (.*)$/gm,"<h1>$1</h1>");
  t = t.replace(/^\s*---+\s*$/gm,"<hr>");
  t = t.replace(/^> ?(.*)$/gm,"<blockquote>$1</blockquote>");
  t = t.replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>").replace(/\*([^*\n]+)\*/g,"<em>$1</em>");
  t = t.replace(/`([^`]+)`/g,"<code>$1</code>");
  t = t.replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  // lists
  t = t.replace(/((?:^[-*] .*\n?)+)/gm, m => "<ul>"+m.trim().split(/\n/).map(l=>"<li>"+l.replace(/^[-*] /,"")+"</li>").join("")+"</ul>");
  t = t.replace(/((?:^\d+\. .*\n?)+)/gm, m => "<ol>"+m.trim().split(/\n/).map(l=>"<li>"+l.replace(/^\d+\. /,"")+"</li>").join("")+"</ol>");
  // paragraphs
  t = t.split(/\n{2,}/).map(b => /^<(h\d|ul|ol|blockquote|hr)/.test(b.trim()) ? b : (b.trim()?"<p>"+b.trim().replace(/\n/g,"<br>")+"</p>":"")).join("\n");
  return t;
}

function scores(){
  const s={}; Object.keys(AGENTS).forEach(a=>s[a]={score:0,pos:0,neg:0,events:[]});
  (DATA.score_events||[]).forEach(e=>{ if(!s[e.agent])return; s[e.agent].score+=e.delta; e.delta>=0?s[e.agent].pos++:s[e.agent].neg++; s[e.agent].events.push(e); });
  return s;
}

// Calibración: ¿acierta cuando apuesta fuerte? Mide el % de acierto de las predicciones
// RESUELTAS (acierto/error; las caducadas no cuentan) desglosado por nivel de convicción.
// Un agente bien calibrado acierta más sus 4-5 que sus 1-2.
function calibration(){
  const out={};
  (DATA.opportunities||[]).forEach(o=>{
    if(o.status!=="acierto" && o.status!=="error") return;
    const ag=o.agent, c=o.conviction||0, hit=o.status==="acierto";
    if(!out[ag]) out[ag]={n:0, byConv:{}};
    out[ag].n++;
    (out[ag].byConv[c] = out[ag].byConv[c]||{a:0,e:0})[hit?"a":"e"]++;
  });
  // veredicto: acierto en apuestas fuertes (4-5) vs flojas (1-2)
  Object.values(out).forEach(o=>{
    const bucket=(lo,hi)=>{let a=0,t=0;for(let c=lo;c<=hi;c++){const b=o.byConv[c];if(b){a+=b.a;t+=b.a+b.e;}}return t?{rate:a/t,t}:null;};
    o.fuerte=bucket(4,5); o.floja=bucket(1,2);
    o.veredicto = (o.fuerte&&o.floja&&o.fuerte.t>=2&&o.floja.t>=2)
      ? (o.fuerte.rate>=o.floja.rate ? "aprovecha" : "descalibrado") : null;
  });
  return out;
}
const rateCol = r => r>=0.6?"var(--good)":r>=0.4?"var(--warning)":"var(--critical)";

// Track record: el historial de rendimiento del equipo a partir de las predicciones
// resueltas y el marcador. Solo cuenta a los cinco especialistas (Ledger y Nexus no
// hacen predicciones).
function trackRecord(){
  const opps=DATA.opportunities||[];
  const resolved=opps.filter(o=>o.status==="acierto"||o.status==="error");
  const aciertos=resolved.filter(o=>o.status==="acierto").length;
  const hitRate=resolved.length?aciertos/resolved.length:null;
  const sc=scores(), cal=calibration();
  const per=Object.keys(AGENTS).filter(k=>k!=="jefe"&&k!=="datos").map(k=>{
    const c=cal[k]||{n:0,byConv:{}}; let a=0; Object.values(c.byConv).forEach(b=>a+=b.a);
    return {k, res:c.n||0, aciertos:a, hit:c.n?a/c.n:null, net:sc[k]?sc[k].score:0, verd:c.veredicto};
  });
  const best=per.filter(p=>p.res>0).sort((a,b)=>b.net-a.net||(b.hit||0)-(a.hit||0))[0]||null;
  return {resueltas:resolved.length, aciertos, errores:resolved.length-aciertos, hitRate,
    vivas:opps.filter(o=>o.status==="abierta").length, caducadas:opps.filter(o=>o.status==="caducada").length,
    per, best};
}

// Evolución del marcador: puntos acumulados del equipo en el tiempo.
function evoPoints(el, events){
  const ev=events.slice().sort((a,b)=>new Date(a.created_at)-new Date(b.created_at));
  let cum=0; const pts=ev.map(e=>({t:e.created_at, v:(cum+=e.delta)}));
  const W=el.clientWidth||600, H=120, pl=34, pr=12, pt=12, pb=20;
  const vals=pts.map(p=>p.v), min=Math.min(0,...vals), max=Math.max(0,...vals), span=(max-min)||1;
  const X=i=>pl+(W-pl-pr)*(pts.length===1?0.5:i/(pts.length-1));
  const Y=v=>pt+(H-pt-pb)*(1-(v-min)/span);
  const grid=getComputedStyle(document.body).getPropertyValue("--grid");
  const blue=cssVal("var(--s1)"), zero=Y(0);
  const path=vals.map((v,i)=>`${i?"L":"M"}${X(i)},${Y(v)}`).join(" ");
  const dots=pts.map((p,i)=>`<circle cx="${X(i)}" cy="${Y(p.v)}" r="7" fill="transparent" data-tip="<div class='t1'>${p.v>0?'+':''}${p.v} pts</div><div class='t2'>${fmtDate(p.t)}</div>"></circle><circle cx="${X(i)}" cy="${Y(p.v)}" r="2.5" fill="${blue}" pointer-events="none"></circle>`).join("");
  el.innerHTML=`<svg width="100%" height="${H}" viewBox="0 0 ${W} ${H}">
    <line x1="${pl}" x2="${W-pr}" y1="${zero}" y2="${zero}" stroke="${grid}" stroke-width="1"/>
    <text x="${pl-6}" y="${zero+3}" text-anchor="end" font-size="9" fill="var(--muted)">0</text>
    <path d="${path}" fill="none" stroke="${blue}" stroke-width="2"/>${dots}</svg>`;
  hookTips(el);
}

const pending = () => (DATA.approvals||[]).filter(a=>a.status==="pendiente");

function sameDay(iso){
  if(!iso) return false;
  const d=new Date(iso), n=new Date();
  return d.getDate()===n.getDate() && d.getMonth()===n.getMonth() && d.getFullYear()===n.getFullYear();
}
function tasksToday(k){ return (DATA.tasks||[]).filter(t=>t.agent===k && sameDay(t.started_at)).length; }

/* "hace 2 h" — el last ping del vídeo */
function relTime(iso){
  if(!iso) return "sin actividad";
  const mins = Math.round((Date.now()-new Date(iso).getTime())/60000);
  if(mins < 1) return "ahora mismo";
  if(mins < 60) return `hace ${mins} min`;
  const h = Math.round(mins/60);
  if(h < 48) return `hace ${h} h`;
  return `hace ${Math.round(h/24)} d`;
}

/* En línea = ha dado señales dentro de la última ronda diaria (36 h de margen). */
function isOnline(row){
  return !!row?.last_ping_at && (Date.now()-new Date(row.last_ping_at).getTime()) < 36*3600*1000;
}

function portfolioValue(){
  const snap=(DATA.snapshots||[])[0];
  if(snap) return Number(snap.total_value);
  return (DATA.positions||[]).reduce((s,p)=>s+Number(p.current_value||0),0);
}

}

/* Avisos que el panel deduce solo, sin depender de que un agente los levante
   ni los mantenga: si el dato está rancio, se ve, aunque nadie lo haya contado. */
function derivedAlerts(){
  const out=[];
  const horas = iso => iso ? (Date.now()-new Date(iso).getTime())/3600000 : Infinity;

  /* Solo posiciones líquidas: la renta fija y el private markets se valoran a
     último precio conocido a propósito, no es un fallo. Y 72 h en vez de 48
     para que un fin de semana no levante el banner por sí solo. */
  const rancias=(DATA.positions||[])
    .filter(p=>!["cash","renta_fija","private_markets"].includes(p.asset_class) && horas(p.updated_at)>72)
    .sort((a,b)=>horas(b.updated_at)-horas(a.updated_at));
  if(rancias.length){
    const peor=Math.round(horas(rancias[0].updated_at)/24);
    const valor=rancias.reduce((s,p)=>s+Number(p.current_value||0),0);
    out.push({
      level: peor>=5 ? "critica" : "aviso",
      message: `${rancias.length} posicion${rancias.length===1?"":"es"} sin precio nuevo (${fmtEUR(valor)}, hasta ${peor} día${peor===1?"":"s"}): ${rancias.map(p=>esc(p.symbol||p.name)).join(", ")}`,
      action_hint: "Son posiciones que cotizan a diario, así que esto sí es un descuido. Deducido de las fechas de actualización, no de un aviso de los agentes."
    });
  }

  const ultima=(DATA.runs||[]).find(r=>r.status==="completed");
  if(!ultima || horas(ultima.finished_at||ultima.started_at)>30){
    out.push({
      level:"critica",
      message:"No hay ninguna ronda completada en las últimas 30 horas.",
      action_hint:"El análisis del panel no es de hoy."
    });
  }

  const encurso=(DATA.runs||[]).find(r=>r.status==="running");
  if(encurso && horas(encurso.started_at)>2){
    out.push({
      level:"aviso",
      message:`La ronda de ${fmtDate(encurso.started_at)} lleva ${Math.round(horas(encurso.started_at))} h abierta sin cerrarse.`,
      action_hint:"Probablemente la sesión murió a medias; lo escrito hasta ahora sí es válido."
    });
  }
  return out;
}

function rAlerts(){
  const list=[...derivedAlerts(), ...(DATA.alerts||[]).filter(a=>a.status==="activa")];
  const color={critica:"var(--critical)", aviso:"var(--warning)", info:"var(--s1)"};

}

/* ═══════════ AGENTES ═══════════ */
function rAgentes(){
  const v=$("#v-agentes"); const sc=scores();
  const reports=DATA.reports||[];
  v.innerHTML = `<div class="agentgrid">` + Object.entries(AGENTS).map(([k,a])=>{
    const rs = reports.filter(r=>r.agent===k);

      <div class="head"><div class="chip">${a.icon}</div>

        <div class="scorebadge" title="Marcador">${s.score>0?"+":""}${s.score} pts</div></div>
      <div class="state"><span class="sdot ${status}"></span><b>${AGENT_STATE[status]}</b>
        <span class="tcount">${nt} tarea${nt===1?"":"s"} hoy</span></div>
      <div class="last">${st?.current_task ? "▸ "+esc(st.current_task) :
        (last?esc(last.title)+" — "+esc(last.content_md.replace(/[#*>`-]/g," ").slice(0,160)):"Sin informes todavía. Se activará en la primera ronda diaria.")}</div>
      <div class="foot">${last?rs.length+" informe(s)":"—"} · último ping ${relTime(st?.last_ping_at)} · pulsa para ver todo</div>
    </div>`;
  }).join("") + `</div>`;
}
function agentModal(k){
  const a=AGENTS[k]; const rs=(DATA.reports||[]).filter(r=>r.agent===k);

async function resolveAppr(id, status, btn){
  if(!WKEY) return;
  let note = "";
  if(status==="rechazada"){
    note = prompt("Motivo del rechazo (opcional):") ?? "";
  }
  const acts = btn.parentElement;
  acts.querySelectorAll("button").forEach(b=>b.disabled=true);
  btn.textContent = "Enviando…";
  try{
    const r = await fetch(`${OPS}/approval/resolve`, {
      method:"POST",
      headers:{"content-type":"application/json","x-ops-token":WKEY},
      body: JSON.stringify({id, status, note})
    });
    if(!r.ok) throw new Error((await r.json().catch(()=>({}))).error || ("HTTP "+r.status));
    await load();
  }catch(err){
    btn.textContent = "Error";
    acts.insertAdjacentHTML("beforeend",
      `<span class="meta" style="color:var(--critical)">No se pudo guardar: ${esc(err.message)}</span>`);
  }
}

function rOpps(){
  const v=$("#v-oportunidades"); const all=DATA.opportunities||[];
  const stFilters=["todas","abierta","acierto","error","caducada"];
  const agents=["todos",...new Set(all.map(o=>o.agent))];

    (list.length?list.map(o=>{
      const a=AGENTS[o.agent]||{nm:o.agent,c:"var(--s8)",icon:"◇"};
      const conv=o.conviction||0;
      const obj=parseObjetivo(o.thesis);
      const cur=esc(o.ref_currency||(obj?obj.cur:"")||"");
      const entryN=o.entry_ref_price!=null?Number(o.entry_ref_price):null;
      const entrada=entryN!=null?`${fmtN(entryN)} ${cur}`.trim():"—";

      const targetN=o.target_price!=null?Number(o.target_price):numEs(obj&&obj.price);
      const tpct=o.target_pct!=null?(o.target_pct>0?"+":"")+fmtN(o.target_pct,1)+"%":(obj?obj.pct:"");
      const objetivo=targetN!=null?`${fmtN(targetN)} ${cur}`.trim()+(tpct?` (${esc(tpct)})`:""):(obj&&obj.pct?esc(obj.pct):"");

      if(entryN!=null&&targetN!=null&&lastN!=null&&targetN!==entryN) prog=(lastN-entryN)/(targetN-entryN)*100;
      const progC=prog==null?null:Math.max(0,Math.min(100,prog));

          <span class="tag">${a.icon} ${a.nm}</span>
          <span class="badge ${o.status}">${o.status==="abierta"?"● Abierta":o.status==="acierto"?"✓ Acierto":o.status==="error"?"✕ Error":"○ Caducada"}</span>
          <span class="conv" title="Convicción ${conv}/5">${[1,2,3,4,5].map(i=>`<i class="${i<=conv?"f":""}"></i>`).join("")}</span></div>
        <div class="thesis"><strong style="color:var(--ink)">Tesis:</strong> ${esc(o.thesis)}</div>
        ${o.risks?`<div class="risks"><strong>Riesgos:</strong> ${esc(o.risks)}</div>`:""}
        ${o.outcome_note?`<div class="risks"><strong>Resolución:</strong> ${esc(o.outcome_note)}</div>`:""}
        <div class="predl">
          <span class="pl-e"><i>Ref. entrada</i><b>${entrada}</b></span>
          <span class="pl-arrow">→</span>
          <span class="pl-o"><i>Objetivo</i>${objetivo?`<b>${objetivo}</b>`:`<b class="na">— sin objetivo</b>`}</span>
          ${lastN!=null?`<span class="pl-now"><i>Ahora</i><b${o.last_price_at?` title="${fmtDate(o.last_price_at)}"`:""}>${fmtN(lastN)} ${cur}</b></span>`:""}
        </div>
        ${progC!=null?`<div class="prog ${prog>=100?"done":prog<0?"bad":""}">
          <div class="prog-bar"><span style="width:${progC.toFixed(0)}%"></span></div>
          <div class="prog-meta">${prog>=100?"✓ objetivo alcanzado":prog<0?"va en contra":`<b>${prog.toFixed(0)}%</b> del camino al objetivo`}${diasTxt?` · ${diasTxt}`:""}</div>
        </div>`:(diasTxt?`<div class="prog"><div class="prog-meta">${diasTxt}</div></div>`:"")}
        <div class="foot"><span>${fmtDate(o.opened_at)}</span>${o.horizon?`<span>Horizonte: ${esc(o.horizon)}</span>`:""}

}

function allocChart(el, byClass, total){
  const entries = Object.entries(byClass).sort((a,b)=>b[1]-a[1]);
  const W=el.clientWidth||800, H=64, bh=28, y=8;
  let x=0;
  let segs="";
  entries.forEach(([k,val])=>{
    const w=Math.max((val/total)*W-2,2);
    segs+=`<rect x="${x}" y="${y}" width="${w}" height="${bh}" rx="4" fill="${cssVal(CLASSCOLOR[k]||"var(--s7)")}"
      data-tip="<div class='t1'>${CLASSES[k]||k}</div><div class='t2'>${fmtEUR(val)} · ${fmtN(val/total*100,1)}%</div>"></rect>`;
    if(val/total>0.12) segs+=`<text x="${x+8}" y="${y+bh/2+4}" font-size="11" fill="#fff" font-weight="600">${fmtN(val/total*100,0)}%</text>`;
    x+=w+2;
  });
  el.innerHTML=`<svg width="100%" height="${H}" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${segs}</svg>
    <div class="legend">${entries.map(([k,val])=>`<span><i style="background:${cssVal(CLASSCOLOR[k]||"var(--s7)")}"></i>${CLASSES[k]||k} · ${fmtEUR(val)}</span>`).join("")}</div>`;
  hookTips(el);
}

function lineChart(el, snaps){
  const W=el.clientWidth||800, H=180, pl=54, pr=12, pt=14, pb=26;
  const vals=snaps.map(s=>Number(s.total_value));
  const min=Math.min(...vals), max=Math.max(...vals);
  const span=(max-min)||1;
  const X=i=>pl+(W-pl-pr)*(snaps.length===1?0.5:i/(snaps.length-1));
  const Y=v=>pt+(H-pt-pb)*(1-(v-min)/span);
  const path=vals.map((v,i)=>`${i?"L":"M"}${X(i)},${Y(v)}`).join(" ");
  const area=path+` L${X(vals.length-1)},${H-pb} L${X(0)},${H-pb} Z`;
  const ink=getComputedStyle(document.body).getPropertyValue("--muted");
  const grid=getComputedStyle(document.body).getPropertyValue("--grid");
  const blue=cssVal("var(--s1)");
  let gl="";
  for(let g=0;g<=3;g++){ const yv=min+span*g/3, yy=Y(yv);
    gl+=`<line x1="${pl}" x2="${W-pr}" y1="${yy}" y2="${yy}" stroke="${grid}" stroke-width="1"/>
    <text x="${pl-8}" y="${yy+4}" text-anchor="end" font-size="10" fill="${ink}">${fmtN(yv/1000,1)}k</text>`; }
  const dots=vals.map((v,i)=>`<circle cx="${X(i)}" cy="${Y(v)}" r="8" fill="transparent"
     data-tip="<div class='t1'>${fmtEUR(v)}</div><div class='t2'>${fmtDate(snaps[i].created_at)}</div>"></circle>
     <circle cx="${X(i)}" cy="${Y(v)}" r="3" fill="${blue}" pointer-events="none"></circle>`).join("");
  el.innerHTML=`<svg width="100%" height="${H}" viewBox="0 0 ${W} ${H}">
    ${gl}
    <path d="${area}" fill="${blue}" opacity="0.10"/>
    <path d="${path}" fill="none" stroke="${blue}" stroke-width="2"/>
    ${dots}
    <text x="${pl}" y="${H-6}" font-size="10" fill="${ink}">${fmtDate(snaps[0].created_at)}</text>
    <text x="${W-pr}" y="${H-6}" text-anchor="end" font-size="10" fill="${ink}">${fmtDate(snaps.at(-1).created_at)}</text>
  </svg>`;
  hookTips(el);
}

  const ink=getComputedStyle(document.body).getPropertyValue("--muted");
  const grid=getComputedStyle(document.body).getPropertyValue("--grid");
  const cA=cssVal("var(--s4)"), cB=cssVal("var(--s1)");
  let gl="";
  for(let g=0;g<=3;g++){ const yv=min+span*g/3, yy=Y(yv);
    gl+=`<line x1="${pl}" x2="${W-pr}" y1="${yy}" y2="${yy}" stroke="${grid}" stroke-width="1"/>
    <text x="${pl-8}" y="${yy+4}" text-anchor="end" font-size="10" fill="${ink}">${fmtN(yv,span<4?2:0)} €</text>`; }
  const line=(key,col,nm)=>{
    const path=hist.map((h,i)=>`${i?"L":"M"}${X(i)},${Y(h[key])}`).join(" ");
    const dots=hist.map((h,i)=>`<circle cx="${X(i)}" cy="${Y(h[key])}" r="8" fill="transparent"
      data-tip="<div class='t1'>${nm} · ${Number(h[key]).toLocaleString("es-ES",{minimumFractionDigits:2})} €</div><div class='t2'>${esc(h.etiqueta)}</div>"></circle>
      <circle cx="${X(i)}" cy="${Y(h[key])}" r="2.5" fill="${col}" pointer-events="none"></circle>`).join("");
    return `<path d="${path}" fill="none" stroke="${col}" stroke-width="2"/>${dots}`;
  };
  el.innerHTML=`<svg width="100%" height="${H}" viewBox="0 0 ${W} ${H}">${gl}${line("btc_hold",cB,"BTC hold")}${line("cartera",cA,"Cartera")}</svg>
  <div class="legend"><span><i style="background:${cA}"></i>Cartera simulada</span><span><i style="background:${cB}"></i>BTC comprado-y-mantenido</span></div>`;
  hookTips(el);
}

/* ═══════════ MARCADOR ═══════════ */
function rMarcador(){
  const v=$("#v-marcador"); const sc=scores();
  const rows=Object.entries(sc).sort((a,b)=>b[1].score-a[1].score);
  const maxAbs=Math.max(1,...rows.map(([,s])=>Math.abs(s.score)));
  const events=(DATA.score_events||[]);
  const calib=calibration();
  const anyCal=Object.values(calib).some(c=>c.n);
  const tr=trackRecord();
  const pct=r=>r==null?"—":Math.round(r*100)+"%";
  const trTable = tr.per.filter(p=>p.res>0).sort((a,b)=>b.net-a.net||(b.hit||0)-(a.hit||0));
  const trBlock=`<div class="card" style="margin-bottom:16px">
    <p class="kicker">Track record del equipo</p>
    <div class="tiles" style="margin-bottom:${tr.resueltas?"18px":"0"}">
      <div class="tile"><div class="lbl">Predicciones resueltas</div><div class="val">${tr.resueltas}</div><div class="sub">${tr.aciertos} aciertos · ${tr.errores} fallos${tr.caducadas?` · ${tr.caducadas} caducadas`:""}</div></div>
      <div class="tile"><div class="lbl">Acierto global</div><div class="val" style="color:${tr.hitRate==null?"var(--ink)":rateCol(tr.hitRate)}">${pct(tr.hitRate)}</div><div class="sub">sobre predicciones resueltas</div></div>
      <div class="tile"><div class="lbl">En juego ahora</div><div class="val">${tr.vivas}</div><div class="sub">predicciones abiertas, aún sin resolver</div></div>
      <div class="tile"><div class="lbl">Mejor agente</div><div class="val" style="font-size:19px">${tr.best?esc(AGENTS[tr.best.k].nm):"—"}</div><div class="sub">${tr.best?`${tr.best.net>0?"+":""}${tr.best.net} pts · ${pct(tr.best.hit)} acierto`:"aún sin datos"}</div></div>
    </div>
    ${events.length>=2?`<p class="kicker" style="margin-top:4px">Evolución del marcador</p><div id="evopts"></div>`:""}
    ${trTable.length?`<table class="trtab"><thead><tr><th>Agente</th><th>Resueltas</th><th>Acierto</th><th>Puntos</th><th>Calibración</th></tr></thead><tbody>
      ${trTable.map(p=>`<tr><td><span style="color:${AGENTS[p.k].c}">${AGENTS[p.k].icon}</span> ${esc(AGENTS[p.k].nm)}</td>
        <td>${p.res}</td><td style="color:${p.hit==null?"var(--muted)":rateCol(p.hit)};font-weight:700">${pct(p.hit)}</td>
        <td style="font-weight:700;color:${p.net>=0?"var(--delta-up)":"var(--critical)"}">${p.net>0?"+":""}${p.net}</td>
        <td class="meta">${p.verd==="aprovecha"?"✓ aprovecha convicción":p.verd==="descalibrado"?"⚠ falla las fuertes":"—"}</td></tr>`).join("")}
    </tbody></table>`:`<div class="empty" style="padding:14px 0">Aún no hay predicciones resueltas. Este historial se irá construyendo conforme Nexus resuelva las llamadas contra el precio real.</div>`}
  </div>`;
  v.innerHTML=trBlock+`<div class="grid2">
    <div class="card"><p class="kicker">Ranking del equipo</p>
      ${rows.map(([k,s])=>{
        const a=AGENTS[k]; const w=Math.abs(s.score)/maxAbs*100;
        const col=s.score>=0?cssVal("var(--s1)"):cssVal("var(--s8)");
        const cal=calib[k]; let calStrip="";
        if(cal&&cal.n){
          const parts=[5,4,3,2,1].filter(c=>cal.byConv[c]).map(c=>{
            const b=cal.byConv[c], t=b.a+b.e;
            return `<span title="Convicción ${c}: ${b.a} de ${t} acertadas">conv ${c} <b style="color:${rateCol(b.a/t)}">${b.a}/${t}</b></span>`;
          }).join('<i class="sep">·</i>');
          const verd=cal.veredicto==="aprovecha"?`<span class="cverd good">✓ aprovecha su convicción</span>`
            :cal.veredicto==="descalibrado"?`<span class="cverd bad">⚠ falla sus apuestas fuertes</span>`:"";
          calStrip=`<div class="calib"><span class="clbl">Calibración</span>${parts}${verd}</div>`;
        }
        return `<div style="margin:14px 0">
          <div style="display:flex;font-size:13px;align-items:center;gap:8px">
            <span style="color:${a.c}">${a.icon}</span><strong>${a.nm}</strong>
            <span style="color:var(--muted);font-size:11px">${esc(a.rol)}</span>
            <span style="margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums">${s.score>0?"+":""}${s.score}</span></div>
          <div style="height:8px;background:var(--surface-2);border-radius:4px;margin-top:6px;overflow:hidden;display:flex;${s.score<0?"justify-content:flex-end":""}">
            <div style="width:${Math.max(w,2)}%;background:${col};border-radius:4px"></div></div>
          ${calStrip}
        </div>`;}).join("")}
      <div class="meta" style="margin-top:10px">El jefe (Nexus) otorga o resta puntos según el resultado real de cada llamada de los agentes.${anyCal?` <b>Calibración</b>: acierto por nivel de convicción (conv 5 = apuesta fuerte). Lo ideal es acertar más las fuertes que las flojas.`:` <b>Calibración</b>: aparecerá bajo cada agente según se resuelvan predicciones — medirá si aciertan cuando apuestan fuerte.`}</div>
    </div>
    <div class="card"><p class="kicker">Últimos movimientos del marcador</p>
      ${events.length?events.slice(0,25).map(e=>{
        const a=AGENTS[e.agent]||{nm:e.agent,icon:"◇",c:"var(--muted)"};
        return `<div class="runrow"><span style="color:${a.c}">${a.icon}</span>
          <span style="min-width:64px;font-weight:700;color:${e.delta>=0?"var(--delta-up)":"var(--critical)"}">${e.delta>0?"+":""}${e.delta} pts</span>
          <span style="flex:1;color:var(--ink-2)">${esc(e.reason)}</span>
          <span class="meta">${fmtDate(e.created_at)}</span></div>`;}).join(""):
        `<div class="empty">Sin valoraciones todavía. Cuando las oportunidades se resuelvan, Nexus puntuará a cada agente aquí.</div>`}
    </div>
  </div>`;
  if(events.length>=2){ const ep=$("#evopts"); if(ep) evoPoints(ep, events); }
}

/* ═══════════ REGISTRO ═══════════ */
function rRegistro(){
  const v=$("#v-registro"); const runs=DATA.runs||[]; const reports=DATA.reports||[];
  v.innerHTML=`<div class="card"><p class="kicker">Rondas del equipo</p>
    ${runs.length?runs.map(r=>`<div class="runrow">
      <span class="dot" style="background:${r.status==="completed"?"var(--good)":r.status==="failed"?"var(--critical)":"var(--warning)"}"></span>
      <span style="font-weight:600">${fmtDate(r.started_at)}</span>
      <span style="flex:1;color:var(--ink-2)">${esc(r.summary||(r.status==="running"?"En curso…":r.status))}</span>
      <span class="meta">${reports.filter(x=>x.run_id===r.id).length} informes</span></div>`).join(""):
      `<div class="empty">La primera ronda diaria aparecerá aquí.</div>`}
  </div>
  <div class="card"><p class="kicker">Toda la información · archivo completo de informes</p>
    ${reports.length?reports.map(r=>{
      const a=AGENTS[r.agent]||{nm:r.agent,icon:"◇",c:"var(--muted)"};
      return `<div class="runrow" style="cursor:pointer" onclick='reportModal("${r.id}")'>
        <span style="color:${a.c}">${a.icon}</span><span style="min-width:70px;font-weight:600">${a.nm}</span>
        <span style="flex:1;color:var(--ink-2)">${esc(r.title)}</span><span class="meta">${fmtDate(r.created_at)}</span></div>`;}).join(""):
      `<div class="empty">Aquí tendrás acceso a cada informe íntegro, sin depurar.</div>`}
  </div>`;
}
function reportModal(id){
  const r=(DATA.reports||[]).find(x=>x.id===id); if(!r)return;
  const a=AGENTS[r.agent]||{nm:r.agent,icon:"◇",c:"var(--muted)",rol:""};
  openModal(`<p class="kicker" style="color:${a.c}">${a.icon} ${a.nm} · ${esc(a.rol||"")}</p>
    <h2 class="title">${esc(r.title)}</h2><div class="meta">${fmtDate(r.created_at)}</div>
    <div class="md" style="margin-top:12px">${md(r.content_md)}</div>`);
}

/* helpers */
function cssVal(v){ // resolve var(--x) to hex for SVG attrs
  if(!v.startsWith("var(")) return v;
  return getComputedStyle(document.documentElement).getPropertyValue(v.slice(4,-1)).trim()||"#888";
}
function hookTips(el){
  el.querySelectorAll("[data-tip]").forEach(n=>{
    n.addEventListener("mousemove",e=>{showTip(e,n.dataset.tip);});
    n.addEventListener("mouseleave",hideTip);
  });
}
window.addEventListener("resize",()=>{ if(DATA){rCartera(); rSimulador();} });

load();
setInterval(load, 60*1000); // auto-refresh cada minuto: el estado de los agentes va vivo
</script>
</body>
</html>
